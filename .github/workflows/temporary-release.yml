name: Build temporary 15-minute release

on:
  push:
    branches:
      - 'devspace/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-release
  cancel-in-progress: true

jobs:
  build-release-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: '2.2.11'
      TAG: temporary-download
      ASSET: LobeHub-Portable-2.2.11-Custom-win-x64.zip
      INSTALLER_SHA256: da4229aaa72f5edbcef73adcbfb2c2fdfa5ce30116aa0774a7f67cd2e925617a
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          npm install --no-save @electron/asar@3.4.1

      - name: Download and verify official LobeHub installer
        run: |
          mkdir -p build
          curl -fL --retry 3 \
            "https://github.com/lobehub/lobehub/releases/download/v${VERSION}/LobeHub-${VERSION}-setup.exe" \
            -o build/LobeHub-setup.exe
          echo "${INSTALLER_SHA256}  build/LobeHub-setup.exe" | sha256sum -c -

      - name: Extract without running installer
        run: |
          mkdir -p build/stage build/portable build/app
          7z x -y build/LobeHub-setup.exe -obuild/stage

          if [ -f build/stage/resources/app.asar ]; then
            cp -a build/stage/. build/portable/
          else
            inner_archive="$(find build/stage -type f \( -iname 'app-*.7z' -o -iname 'app.7z' \) | head -n 1)"
            if [ -z "$inner_archive" ]; then
              echo 'Installer extraction did not produce resources/app.asar or an inner app archive.' >&2
              find build/stage -maxdepth 4 -type f -printf '%P\n' | sort | head -n 200
              exit 1
            fi
            echo "Extracting inner application archive: $inner_archive"
            7z x -y "$inner_archive" -obuild/portable
          fi

          test -f build/portable/resources/app.asar
          npx asar extract build/portable/resources/app.asar build/app
          test -f build/app/dist/renderer/apps/desktop/index.html

      - name: Apply UI and provider customization
        run: node scripts/patch.mjs build/app

      - name: Repack application resources
        run: |
          mkdir -p build/patched
          npx asar pack build/app build/patched/app.asar \
            --unpack '{**/*.node,**/font-list/libs/darwin/fontlist,**/get-windows/main}'
          cp build/patched/app.asar build/portable/resources/app.asar
          rm -rf build/portable/resources/app.asar.unpacked
          cp -a build/patched/app.asar.unpacked build/portable/resources/app.asar.unpacked

      - name: Add package documentation
        run: |
          cat > build/portable/README-CUSTOM.txt <<'EOF'
          LobeHub Desktop 2.2.11 Custom Portable

          - No installer is executed; extract the ZIP and run LobeHub.exe.
          - Paid-upgrade promotion cards and purchase entry points are hidden.
          - Account, usage, normal settings, and Provider pages remain visible.
          - The LobeHub Provider remains visible and receives the normal on/off switch.
          - On first launch per user profile, the LobeHub Provider is disabled once.
          - Later manual changes are preserved.
          - This does not unlock paid features or alter server-side subscriptions, quotas, or permissions.

          This package is built from the official LobeHub 2.2.11 installer.
          Upstream project: https://github.com/lobehub/lobehub
          EOF

      - name: Validate package
        run: |
          test -f build/portable/LobeHub.exe
          test -f build/portable/resources/app.asar
          test -d build/portable/resources/app.asar.unpacked
          test -f build/portable/resources.pak
          test -f build/portable/icudtl.dat
          test -f build/portable/libEGL.dll
          test -f build/portable/libGLESv2.dll
          test -f build/portable/ffmpeg.dll
          npx asar list build/portable/resources/app.asar | grep -q 'lobehub-customization-runtime.js'
          native_count="$(find build/portable/resources/app.asar.unpacked -type f -iname '*.node' | wc -l)"
          test "$native_count" -ge 9
          file build/portable/LobeHub.exe | grep -q 'PE32+ executable'

      - name: Create ZIP
        run: |
          rm -f "$ASSET"
          (cd build && 7z a -tzip -mx=0 "../$ASSET" portable)
          7z t "$ASSET"
          hash="$(sha256sum "$ASSET" | awk '{print $1}')"
          echo "ASSET_SHA256=$hash" >> "$GITHUB_ENV"
          {
            echo '### Temporary download'
            echo
            echo "SHA-256: \`$hash\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Replace previous temporary release
        run: gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true

      - name: Publish temporary release
        run: |
          expires="$(date -u -d '+15 minutes' '+%Y-%m-%d %H:%M:%S UTC')"
          cat > /tmp/release-notes.txt <<EOF
          Temporary customized LobeHub Desktop 2.2.11 portable package.

          This Release and its asset are scheduled for deletion at approximately $expires.
          SHA-256: $ASSET_SHA256
          EOF
          gh release create "$TAG" "$ASSET" \
            --title 'Temporary LobeHub custom portable download' \
            --notes-file /tmp/release-notes.txt
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$ASSET"
          {
            echo '### Download link'
            echo
            echo "$url"
            echo
            echo "Scheduled deletion: $expires"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep release available for 15 minutes
        run: sleep 900

      - name: Delete temporary release and asset
        if: always()
        run: gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
